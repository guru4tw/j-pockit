<svg viewBox="0 0 980 330" xmlns="http://www.w3.org/2000/svg" width="980" height="330" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans CJK TC, sans-serif">
  <rect width="980" height="330" fill="#fff"/>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#999"/>
    </marker>
  </defs>
  <!-- 0 setup -->
  <rect x="8" y="20" width="176" height="170" rx="6" fill="#4a9a6a20" stroke="#4a9a6a" stroke-width="1.5"/>
  <text x="96" y="44" fill="#222" font-size="13" font-weight="600" text-anchor="middle">0. 設定(一次性)</text>
  <text x="96" y="64" fill="#4a9a6a" font-size="11" text-anchor="middle">兩套各一</text>
  <text x="96" y="92" fill="#222" font-size="11" font-family="Consolas, monospace" text-anchor="middle">/setup-pstack</text>
  <text x="96" y="108" fill="#888" font-size="10.5" text-anchor="middle">每台機器一次</text>
  <text x="96" y="136" fill="#222" font-size="10.5" font-family="Consolas, monospace" text-anchor="middle">/setup-matt-pocock-skills</text>
  <text x="96" y="152" fill="#888" font-size="10.5" text-anchor="middle">每個 repo 一次</text>
  <!-- 1 plan -->
  <rect x="204" y="20" width="176" height="170" rx="6" fill="#3a86c820" stroke="#3a86c8" stroke-width="1.5"/>
  <text x="292" y="44" fill="#222" font-size="13" font-weight="600" text-anchor="middle">1. 規劃 / 規格 / 票</text>
  <text x="292" y="64" fill="#3a86c8" font-size="11" text-anchor="middle">Pocock</text>
  <text x="292" y="92" fill="#222" font-size="11" font-family="Consolas, monospace" text-anchor="middle">/grill-with-docs</text>
  <text x="292" y="116" fill="#222" font-size="11" font-family="Consolas, monospace" text-anchor="middle">↓ /to-spec</text>
  <text x="292" y="140" fill="#222" font-size="11" font-family="Consolas, monospace" text-anchor="middle">↓ /to-tickets</text>
  <text x="292" y="166" fill="#888" font-size="10.5" text-anchor="middle">產出:ADR、GLOSSARY、票</text>
  <!-- 2 execute -->
  <rect x="400" y="20" width="176" height="170" rx="6" fill="#c88a5a20" stroke="#c88a5a" stroke-width="1.5"/>
  <text x="488" y="44" fill="#222" font-size="13" font-weight="600" text-anchor="middle">2. 執行</text>
  <text x="488" y="64" fill="#c88a5a" font-size="11" text-anchor="middle">pstack 為主</text>
  <text x="488" y="92" fill="#222" font-size="11" font-family="Consolas, monospace" text-anchor="middle">/how  先看懂</text>
  <text x="488" y="112" fill="#222" font-size="11" font-family="Consolas, monospace" text-anchor="middle">/swarm  平行</text>
  <text x="488" y="140" fill="#3a86c8" font-size="10.5" text-anchor="middle">Pocock 逐票:</text>
  <text x="488" y="158" fill="#222" font-size="11" font-family="Consolas, monospace" text-anchor="middle">/implement → /tdd</text>
  <!-- 3 verify -->
  <rect x="596" y="20" width="176" height="170" rx="6" fill="#c88a5a20" stroke="#c88a5a" stroke-width="1.5"/>
  <text x="684" y="44" fill="#222" font-size="13" font-weight="600" text-anchor="middle">3. 驗證 / 審查 / PR</text>
  <text x="684" y="64" fill="#c88a5a" font-size="11" text-anchor="middle">pstack 為主</text>
  <text x="684" y="92" fill="#222" font-size="11" font-family="Consolas, monospace" text-anchor="middle">/interrogate</text>
  <text x="684" y="112" fill="#222" font-size="11" font-family="Consolas, monospace" text-anchor="middle">/unslop  修文字</text>
  <text x="684" y="140" fill="#3a86c8" font-size="10.5" text-anchor="middle">Pocock 可並用:</text>
  <text x="684" y="158" fill="#222" font-size="11" font-family="Consolas, monospace" text-anchor="middle">/code-review、pr</text>
  <!-- 4 retro -->
  <rect x="792" y="20" width="176" height="170" rx="6" fill="#3a86c820" stroke="#3a86c8" stroke-width="1.5"/>
  <text x="880" y="44" fill="#222" font-size="13" font-weight="600" text-anchor="middle">4. 回顧</text>
  <text x="880" y="64" fill="#3a86c8" font-size="11" text-anchor="middle">Pocock</text>
  <text x="880" y="92" fill="#222" font-size="11" font-family="Consolas, monospace" text-anchor="middle">/retro</text>
  <text x="880" y="120" fill="#c88a5a" font-size="10.5" text-anchor="middle">pstack 替代:</text>
  <text x="880" y="138" fill="#222" font-size="11" font-family="Consolas, monospace" text-anchor="middle">/reflect</text>
  <!-- forward arrows -->
  <line x1="184" y1="105" x2="202" y2="105" stroke="#999" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="380" y1="105" x2="398" y2="105" stroke="#999" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="576" y1="105" x2="594" y2="105" stroke="#999" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="772" y1="105" x2="790" y2="105" stroke="#999" stroke-width="1.5" marker-end="url(#ah)"/>
  <!-- poteto-mode band -->
  <rect x="400" y="204" width="372" height="30" rx="4" fill="#c88a5a14" stroke="#c88a5a" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="586" y="224" fill="#222" font-size="11.5" text-anchor="middle">/poteto-mode 常駐(pstack 的 agent 工作風格,2、3 全程開著)</text>
  <!-- loop back -->
  <path d="M 880 190 L 880 262 L 292 262 L 292 194" fill="none" stroke="#999" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#ah)"/>
  <text x="586" y="280" fill="#888" font-size="11" text-anchor="middle">下一張票 / 下一輪</text>
  <!-- legend -->
  <rect x="250" y="302" width="14" height="12" fill="#3a86c820" stroke="#3a86c8"/>
  <text x="270" y="312" fill="#222" font-size="11">Pocock</text>
  <rect x="360" y="302" width="14" height="12" fill="#c88a5a20" stroke="#c88a5a"/>
  <text x="380" y="312" fill="#222" font-size="11">pstack</text>
  <rect x="470" y="302" width="14" height="12" fill="#4a9a6a20" stroke="#4a9a6a"/>
  <text x="490" y="312" fill="#222" font-size="11">兩套各一</text>
</svg>
